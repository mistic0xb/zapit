services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - app_data:/app/dist-volume
    networks:
      - app_network

  caddy:
    image: caddy:latest
    container_name: zapit_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - app_data:/srv
      - caddy_data:/data
      - caddy_config:/config
      - glassabbey_data:/srv/glassabbey
      - /home/angor/pekka/install.sh:/var/www/pekka/install.sh
    depends_on:
      - app
    networks:
      - app_network
      - web

  glassabbey:
    build:
      context: /home/angor/glassabbey/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - glassabbey_data:/app/dist-volume
    networks:
      - app_network

  auction-server:
    build:
      context: /home/angor/glassabbey/auction_server
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - web

volumes:
  app_data:
  caddy_data:
  caddy_config:
  glassabbey_data:

networks:
  app_network:
    driver: bridge
  web:
    external: true